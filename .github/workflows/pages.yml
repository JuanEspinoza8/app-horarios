# Publica la versión web en GitHub Pages en cada push a main.
# En GitHub: Settings → Pages → Source: "GitHub Actions" (se configura una sola vez).
name: Publicar web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test

      # --no-web-resources-cdn: el motor gráfico va dentro del sitio (sin CDN),
      # así la app funciona sin conexión.
      - run: flutter build web --release --base-href /${{ github.event.repository.name }}/ --no-web-resources-cdn

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
